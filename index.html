 const doAsyncStuffWithCallback = (numero1, numero2, callback) => {
    const resultado = numero1 + numero2
    return setTimeout(() => {
        callback(resultado)
    }, 500)
}

const doAsyncStuffWithPromises = (numero1, numero2) => {
    const resultado = numero1 + numero2
    return new Promise(resolve => {
        setTimeout(() => {
            resolve(resultado)
        }, 500)
    })
}
